# ------------------------------------------------------------------
# DE KAART VAN DEN OMGEKEERDE
# ------------------------------------------------------------------
# Dit bestand is de hele kaart. Wat hier staat, staat op de site.
# Ge moet geen programmeur zijn om dit aan te passen — lees gewoon
# even mee.
#
# EEN PRIJS VERANDEREN
#   Zoek het item en verander enkel het getal achter "price:".
#   Altijd met een punt, nooit met een komma. 2.70 wordt op de
#   site vanzelf "€ 2,70".
#
# EEN ITEM TOEVOEGEN
#   Kopieer een bestaand blokje en pas het aan. Het minimum is:
#     - id: nieuw-bierke
#       name: Nieuw Bierke
#       category: bier
#       price: 5.00
#   Let op: twee spaties inspringen, en een streepje voor "id".
#   Is er geen prijs (gratis, "priceless"), gebruik dan
#   "priceLabel: Gratis" in plaats van "price:".
#
# IDS
#   Elke "id" moet uniek zijn in heel dit bestand: kleine letters,
#   cijfers en streepjes, geen spaties of leestekens. Staat er twee
#   keer dezelfde id, dan weigert de site te bouwen en zegt ze welke.
#   Verander een id liever niet meer nadat hij online staat.
#
# IETS TIJDELIJK UITVERKOCHT?
#   Zet er "available: false" bij. Het item blijft staan, maar grijs.
#   Niks wissen dus — anders moet ge het later opnieuw typen.
#
# CATEGORIEËN (category:)
#   lokaal, promo, favos, bier, alcoholvrij, frisdrank, warm, spritz,
#   apero, cocktails, rum, spirits, shots, eten
#
#   Elke drank staat maar ÉÉN keer in deze lijst, in zijn eigen
#   categorie. Dat een bier ook lokaal is, of een favorietje, of in
#   promo — dat zetten we met een tag. Daarom vindt ge hieronder geen
#   items onder "lokaal" of "favos": die worden uit de tags gehaald.
#
# TAGS (tags: [...])
#   lokaal             staat op ons lijstje LOKAAL
#   promo              er is promo op
#   favo               een favorietje van ons
#   trappist           echte trappist
#   alcoholvrij        0,0
#   op-tap             van het vat
#   gents              in of rond Gent gebrouwen
#   bier-van-de-maand  er kan er maar één tegelijk zijn
#
# BIERSTIJLEN (style:, enkel bij bier)
#   pils, blond, tripel, trappist, ipa, bruin, wit, fruit, geuze,
#   stout, cider, amber
#
# ABV EN BROUWERIJ
#   Enkel invullen als ge het zeker weet. Liever niks dan verkeerd.
#
# NOTITIES (note: / noteEn:)
#   Enkel als het echt iets uitlegt. Niet elk bierke heeft een verhaaltje.
# ------------------------------------------------------------------

intro:
  nl: >-
    Van een simpel pilske tot bierkes die ge nergens anders vindt.
    Alles wat achter de toog staat, staat hier ook — en klopt er iets
    niet meer, vraagt het dan gewoon aan de toog.
  en: >-
    From a plain lager to beers you will not find anywhere else.
    Everything behind the bar is on this list — and if something looks
    off, just ask us at the bar.

updated: '2026-09-10'

