# ============================================================
# AGENDA
# ------------------------------------------------------------
# Een event toevoegen: kopieer een blok hieronder, pas het aan,
# en zet het bovenaan de lijst. Voorbije events verhuizen vanzelf
# naar "Al geweest" — ge moet niets verwijderen.
#
# start: 2026-10-03T21:00   (jaar-maand-dag T uur:minuut, Gentse tijd)
# type:  concert | dj | quiz | aperomer | feest | open-air | andere
# price: laat weg of zet 0 voor gratis
# ============================================================

# ---- Terugkerende afspraken ----
# Die berekent de site zelf. Ge moet ze dus nooit opnieuw invoeren.
recurring:
  - id: aperomer
    title: "Aper'Omer"
    titleEn: "Aper'Omer"
    type: aperomer
    rule: monthly-weekday
    weekday: 5 # 0 = zondag, 5 = vrijdag
    ordinal: 1 # de eerste vrijdag van elke maand
    time: '17:00'
    # Datums waarop het toch niet doorgaat, bv. omdat we later opengaan.
    # 1 januari 2027 valt op een vrijdag, maar dan gaan we pas om 18u open.
    skip:
      - '2027-01-01'
    price: 3.50
    description: >-
      Elke eerste vrijdag van de maand schenken we Omer aan aperoprijs.
      Van vijf uur tot het vat leeg is.
    descriptionEn: >-
      Every first Friday of the month we pour Omer at aperitif price.
      From five o'clock until the keg runs dry.

# ---- Losse events ----
# ---- Losse events ----
# Events uit SuperHoreca komen er vanzelf bij; die moet ge hier niet zetten.
# Hier enkel wat niet in SuperHoreca staat, of een SuperHoreca-event dat ge
# een prijs, Engelse tekst of foto wilt geven (zelfde datum, exact dezelfde titel).
#
# Voorbeeld (haal de # weg en zet "events: []" hieronder op "events:"):
#
#  - id: soulnight-december
#    title: 'Soul Night met DJ Bompa'
