# ============================================================
# AGENDA
# ------------------------------------------------------------
# Een event toevoegen: kopieer een blok hieronder, pas het aan,
# en zet het bovenaan de lijst. Voorbije events verhuizen vanzelf
# naar "Al geweest" — ge moet niets verwijderen.
#
# start: 2026-10-03T21:00   (jaar-maand-dag T uur:minuut, Gentse tijd)
# type:  concert | dj | quiz | aperomer | feest | open-air | andere
# price: laat weg of zet 0 voor gratis
# ============================================================

# ---- Terugkerende afspraken ----
# Die berekent de site zelf. Ge moet ze dus nooit opnieuw invoeren.
recurring:
  - id: aperomer
    title: "Aper'Omer"
    titleEn: "Aper'Omer"
    type: aperomer
    rule: monthly-weekday
    weekday: 5 # 0 = zondag, 5 = vrijdag
    ordinal: 1 # de eerste vrijdag van elke maand
    time: '17:00'
    # Datums waarop het toch niet doorgaat, bv. omdat we later opengaan.
    # 1 januari 2027 valt op een vrijdag, maar dan gaan we pas om 18u open.
    skip:
      - '2027-01-01'
    price: 3.50
    description: >-
      Elke eerste vrijdag van de maand schenken we Omer aan aperoprijs.
      Van vijf uur tot het vat leeg is.
    descriptionEn: >-
      Every first Friday of the month we pour Omer at aperitif price.
      From five o'clock until the keg runs dry.

# ---- Losse events ----
# ---- Losse events ----
# Events uit SuperHoreca komen er vanzelf bij; die moet ge hier niet zetten.
# Hier enkel wat niet in SuperHoreca staat, of een SuperHoreca-event dat ge
# een prijs, Engelse tekst of foto wilt geven (zelfde datum, exact dezelfde titel).
#
# Voorbeeld (haal de # weg en zet "events: []" hieronder op "events:"):
#
#  - id: soulnight-december
#    title: 'Soul Night met DJ Bompa'
#    titleEn: 'Soul Night with DJ Bompa'
#    start: '2026-12-19T21:00'
#    end: '2026-12-20T02:00'
#    type: dj
#    price: 0
#    description: >-
#      Northern soul, funk en een pak vinyl uit den ouwen doos.
#    descriptionEn: >-
#      Northern soul, funk and a stack of vinyl from the good old days.
events:
  - id: feestweek-oktober-2026
    title: 'Feestweek 26 oktober tot 1 november'
    titleEn: 'Party week 26 October to 1 November'
    start: '2026-10-26T13:30'
    end: '2026-11-02T03:00'
    type: feest
    # Geen prijs: elke dag een andere deal.
    price: null
    description: >-
      Den Omgekeerden bestaat 12 jaar, en dat vieren we met zotte promoties:
      van maandag 26 oktober tot zondag 1 november elke dag nen nieuwe deal aan
      de toog. Donderdag de Halloweenparty erbovenop.
    descriptionEn: >-
      De Omgekeerde Wereld turns 12, and we are celebrating with crazy deals:
      from Monday 26 October to Sunday 1 November, a new deal at the bar every
      day. Plus the Halloween party on Thursday.
    # Affiche uit de Instagram-post van 22 oktober 2026.
    image: '/images/events/feestweek-2026.jpg'
    imageRatio: '4 / 5'
    imageAlt: >-
      Affiche "Feestweek in OW!": een dj in een wit T-shirt steekt beide handen in de
      lucht voor een muur vol foto's. Tekst: 12 jaar Omgekeerde Wereld, 26 oktober tot
      1 november. Den Omgekeerden bestaat 12 jaar en dat vieren we met zotte promoties.
    deals:
      - date: '2026-10-26'
        name: 'Gouden Carolus Tripel 1+1'
      - date: '2026-10-27'
        name: 'Strongbow Apple & Red Berries 3+2'
      - date: '2026-10-28'
        name: 'Cherry Chouffe 1+1'
      - date: '2026-10-29'
        name: 'Flying Fish 1+1'
      - date: '2026-10-30'
        name: 'Weer nen Tripel minder 1+1'
      - date: '2026-10-31'
        name: 'Corona Extra 1+1'
      - date: '2026-11-01'
        name: 'Gulden Draak Brewmaster 2+1'

